<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JIRA Ticket Creator</title>

  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <header class="app-header">
    <div class="mark" aria-hidden="true">
      <img src="./icons/icon128.png" alt="" />
    </div>
    <div class="header-text">
      <p class="eyebrow">QA&nbsp;Site&nbsp;→&nbsp;Jira</p>
      <h1>Ticket Creator</h1>
    </div>
  </header>

  <section class="field-block">
    <label class="field-label" for="jiraBaseUrl">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13.5 10.5 21 3M21 3h-5.5M21 3v5.5M11 5H7a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Base URL
    </label>
    <input id="jiraBaseUrl" type="text" inputmode="url" autocomplete="off" placeholder="https://company.atlassian.net" aria-describedby="jiraBaseUrlError" />
    <p id="jiraBaseUrlError" class="field-error" role="alert" style="display: none;"></p>

    <label class="field-label" for="projectKey">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m20.6 12.6-7.9 7.9a2 2 0 0 1-2.8 0l-7-7a2 2 0 0 1 0-2.8l7.9-7.9A2 2 0 0 1 12.2 2H19a2 2 0 0 1 2 2v6.8a2 2 0 0 1-.4 1.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15" cy="8" r="1.4" fill="currentColor"/></svg>
      Project key
    </label>
    <input id="projectKey" type="text" autocomplete="off" placeholder="e.g. PROJ" />

    <div id="projectTags" class="project-tags" aria-label="Recent project keys"></div>
  </section>

  <div class="tabs" role="tablist">
    <button id="tabSingle" class="tab-btn active" type="button" role="tab" aria-selected="true" data-view="single">
      Import Current Ticket
    </button>
    <button id="tabBulk" class="tab-btn" type="button" role="tab" aria-selected="false" data-view="bulk">
      Bulk Import
    </button>
  </div>

  <!-- Single-ticket view -->
  <div id="singleView" class="view">
    <section class="field-block">
      <span class="field-label" id="sourceSiteLabel">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 12h17M12 3.5c2.2 2.3 3.3 5 3.3 8.5s-1.1 6.2-3.3 8.5c-2.2-2.3-3.3-5-3.3-8.5S9.8 5.8 12 3.5Z" stroke="currentColor" stroke-width="1.8"/></svg>
        Source site
      </span>
      <div class="site-toggle">
        <button type="button" class="site-toggle-label active" data-site="Octane">Octane</button>
        <label class="switch" id="sourceSiteSwitch">
          <input type="checkbox" id="sourceSiteInput" class="switch-input" aria-labelledby="sourceSiteLabel" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <button type="button" class="site-toggle-label" data-site="Spark">Spark</button>
      </div>
    </section>

    <div class="button-group">
      <button id="createTicket" type="button">
        <span class="btn-spinner" aria-hidden="true"></span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="btn-label">Create ticket</span>
      </button>

      <button id="openWebsite" class="btn-ghost" type="button" style="display: none;">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log in to Jira
      </button>
    </div>

    <div id="ticketResult"></div>
  </div>

  <!-- Bulk-import view -->
  <div id="bulkView" class="view" hidden>
    <section class="field-block">
      <label class="field-label" for="fileInput">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Excel file
      </label>

      <label class="file-dropzone" for="fileInput">
        <input id="fileInput" type="file" accept=".xlsx,.xlsm,.xltx,.xltm,.xls" />
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="dropzoneTitle" class="dropzone-title">Choose an Excel file</span>
        <span id="dropzoneHint" class="dropzone-hint">ID&rdquo;, &ldquo;Name&rdquo; and &ldquo;Description&rdquo; columns required</span>
      </label>

      <p id="fileError" class="field-error" role="alert" style="display: none;"></p>
      <p id="fileSummary" class="file-summary"></p>
    </section>

    <section id="previewSection" class="field-block" style="display: none;">
      <div class="preview-toolbar">
        <label class="select-all">
          <input id="selectAllCheckbox" type="checkbox" checked />
          Select all
        </label>
        <span id="selectionCount" class="selection-count"></span>
      </div>

      <div class="table-wrap">
        <table id="previewTable">
          <thead>
            <tr>
              <th class="col-check"></th>
              <th>ID</th>
              <th>Title</th>
              <th>Description preview</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>

      <div id="progressSection" class="progress" role="progressbar" aria-label="Import progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="display: none;">
        <div class="progress-head">
          <span id="progressLabel" class="progress-label">Importing tickets…</span>
          <span id="progressPercent" class="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div class="button-group">
        <button id="importBtn" type="button" class="btn-primary">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-label">Create selected tickets</span>
        </button>
      </div>

      <button id="bulkLoginBtn" class="btn-ghost" type="button" style="display: none;">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log in to Jira
      </button>

      <button id="exportBtn" class="btn-ghost" type="button" style="display: none;">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download report
      </button>
    </section>
  </div>

  <!-- Shared status bar, used by both views -->
  <div id="status" class="status" data-state="info">
    <span class="status-cursor" aria-hidden="true"></span>
    <span id="statusText" class="status-text">Configure Jira details and create a ticket.</span>
  </div>

  <script src="libraries/jira-adf.js"></script>
  <script type="module" src="popup.js"></script>
</body>

</html>
